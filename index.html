<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wavelength</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#fbfaf8; --panel:#fff; --ink:#15140f; --muted:#7a776f; --faint:#b5b2aa;
    --line:#ebe8e2; --soft:#f2f0eb; --accent:#e4572e;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 Inter,-apple-system,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
  body { padding-bottom:calc(118px + env(safe-area-inset-bottom)); }
  button { font:inherit; cursor:pointer; }

  header { max-width:980px; margin:0 auto; padding:34px 24px 10px; display:flex; align-items:baseline; gap:24px; }
  header h1 { font-size:22px; font-weight:600; letter-spacing:-0.4px; margin:0; }
  header .count { color:var(--faint); font-size:13px; }
  .search { max-width:980px; margin:0 auto; padding:10px 24px 26px; }
  .search input { width:100%; padding:13px 16px; border:1px solid var(--line); border-radius:12px; background:var(--panel); font:inherit; font-size:15px; outline:none; transition:border-color .15s, box-shadow .15s; }
  .search input:focus { border-color:var(--ink); box-shadow:0 0 0 3px rgba(21,20,15,.06); }
  .search input::placeholder { color:var(--faint); }

  main { max-width:980px; margin:0 auto; padding:0 24px; }
  .empty { color:var(--muted); text-align:center; padding:90px 20px; }
  .group { margin-bottom:34px; }
  .group h2 { font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px 12px; }

  .track { display:grid; grid-template-columns:48px 1fr auto; gap:14px; align-items:center; padding:9px 12px; border-radius:12px; cursor:pointer; transition:background .12s; }
  .track:hover { background:var(--soft); }
  .track.active { background:var(--panel); box-shadow:0 1px 0 var(--line), 0 6px 20px -12px rgba(0,0,0,.18); }
  .art { position:relative; width:48px; height:48px; border-radius:8px; overflow:hidden; background:var(--soft); }
  .art img { width:100%; height:100%; object-fit:cover; display:block; }
  .art .ov { position:absolute; inset:0; display:grid; place-items:center; background:rgba(0,0,0,.42); color:#fff; opacity:0; transition:opacity .12s; }
  .track:hover .art .ov { opacity:1; }
  .track.active .art .ov { opacity:1; }
  .eq { display:flex; align-items:flex-end; gap:2px; height:14px; }
  .eq i { width:3px; background:#fff; border-radius:1px; animation:eq .9s ease-in-out infinite; }
  .eq i:nth-child(2){ animation-delay:.2s } .eq i:nth-child(3){ animation-delay:.4s }
  .paused .eq i { animation-play-state:paused; height:4px !important; }
  @keyframes eq { 0%,100%{height:4px} 50%{height:14px} }
  .track .t { font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track .a { color:var(--muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track.active .t { color:var(--accent); }
  .track .d { color:var(--faint); font-size:13px; font-variant-numeric:tabular-nums; }

  footer { position:fixed; left:0; right:0; bottom:0; background:rgba(255,255,255,.92); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-top:1px solid var(--line); padding:12px 24px calc(12px + env(safe-area-inset-bottom)); }
  .bar { max-width:980px; margin:0 auto; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:20px; }
  .now { display:flex; align-items:center; gap:12px; min-width:0; }
  .now img { width:50px; height:50px; border-radius:8px; background:var(--soft); object-fit:cover; display:block; }
  .now .t { font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .now .a { color:var(--muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ctl { display:flex; flex-direction:column; align-items:center; gap:6px; width:380px; max-width:100%; }
  .btns { display:flex; align-items:center; gap:10px; }
  .btns button { background:none; border:0; width:36px; height:36px; border-radius:50%; display:grid; place-items:center; color:var(--ink); transition:background .12s; }
  .btns button:hover { background:var(--soft); }
  .btns button.on { color:var(--accent); }
  .btns .play { background:var(--ink); color:#fff; width:42px; height:42px; }
  .btns .play:hover { background:#000; }
  .btns .play svg + svg { display:none; }
  .btns .play.playing svg:first-child { display:none; }
  .btns .play.playing svg + svg { display:block; }
  .seek { width:100%; display:flex; align-items:center; gap:10px; font-size:12px; color:var(--faint); font-variant-numeric:tabular-nums; }
  .seek input { flex:1; }
  .vol { display:flex; justify-content:flex-end; align-items:center; gap:8px; color:var(--muted); }
  .vol input { width:100px; }

  input[type=range] { -webkit-appearance:none; appearance:none; height:4px; border-radius:2px; background:linear-gradient(to right, var(--ink) var(--p,0%), var(--line) var(--p,0%)); outline:none; margin:0; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:12px; height:12px; border-radius:50%; background:var(--ink); border:2px solid #fff; box-shadow:0 0 0 1px var(--line); cursor:pointer; }
  input[type=range]::-moz-range-thumb { width:12px; height:12px; border-radius:50%; background:var(--ink); border:2px solid #fff; cursor:pointer; }

  @media (max-width:720px) {
    header { padding-top:26px; }
    .bar { grid-template-columns:1fr; gap:8px; }
    .now { justify-content:center; }
    .ctl { width:100%; }
    .vol { display:none; }
  }
</style>
</head>
<body>
<header><h1>Wavelength</h1><span class="count" id="count"></span></header>
<div class="search"><input id="q" type="search" placeholder="Search songs, artists, albums" autocomplete="off"></div>
<main id="list"><div class="empty">Loading…</div></main>

<footer>
  <div class="bar">
    <div class="now">
      <img id="nowArt" alt="">
      <div style="min-width:0"><div class="t" id="nowTitle">Nothing playing</div><div class="a" id="nowArtist"></div></div>
    </div>
    <div class="ctl">
      <div class="btns">
        <button id="shuffle" title="Shuffle"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
        <button id="prev" title="Previous"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
        <button id="toggle" class="play" title="Play / Pause">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
        </button>
        <button id="next" title="Next"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
        <button id="repeat" title="Repeat"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></button>
      </div>
      <div class="seek"><span id="pos">0:00</span><input id="seek" type="range" min="0" max="1000" value="0"><span id="dur">0:00</span></div>
    </div>
    <div class="vol">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7"/></svg>
      <input id="vol" type="range" min="0" max="100" value="80">
    </div>
  </div>
</footer>
<audio id="audio" preload="none"></audio>

<script>
const $ = id => document.getElementById(id);
const audio = $('audio');
let songs = [], current = -1, shuffle = false, repeat = false;

const fmt = s => { s = Math.floor(s || 0); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const setRange = (el, v) => { el.value = v; el.style.setProperty('--p', (v / el.max * 100) + '%'); };

fetch('songs.json').then(r => r.json()).then(list => {
  songs = list;
  $('count').textContent = songs.length + (songs.length === 1 ? ' song' : ' songs');
  render();
}).catch(() => { $('list').innerHTML = '<div class="empty">Could not load songs.json</div>'; });

$('q').oninput = render;
function render() {
  const q = $('q').value.trim().toLowerCase();
  const rows = songs.map((s, i) => ({ s, i })).filter(({ s }) => !q || [s.title, s.artist, s.album].join(' ').toLowerCase().includes(q));
  if (!rows.length) { $('list').innerHTML = `<div class="empty">${songs.length ? 'No matches' : 'No songs yet'}</div>`; return; }
  const groups = new Map();
  rows.forEach(r => { const k = r.s.artist || 'Unknown'; (groups.get(k) || groups.set(k, []).get(k)).push(r); });
  $('list').innerHTML = [...groups].map(([artist, list]) => `
    <section class="group"><h2>${esc(artist)}</h2>${list.map(({ s, i }) => `
      <div class="track ${i === current ? 'active' : ''}" data-i="${i}">
        <div class="art">${s.cover ? `<img src="${esc(s.cover)}" alt="">` : ''}<div class="ov">${i === current
          ? '<div class="eq"><i></i><i></i><i></i></div>'
          : '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>'}</div></div>
        <div style="min-width:0"><div class="t">${esc(s.title)}</div><div class="a">${esc(s.album || s.artist)}</div></div>
        <div class="d">${s.duration || ''}</div>
      </div>`).join('')}</section>`).join('');
  $('list').querySelectorAll('.track').forEach(el => el.onclick = () => play(+el.dataset.i));
  syncPaused();
}
function syncPaused() { document.body.classList.toggle('paused', audio.paused); $('toggle').classList.toggle('playing', !audio.paused); }

function play(i) {
  if (i < 0 || i >= songs.length) return;
  if (i === current) { audio.paused ? audio.play() : audio.pause(); return; }
  current = i;
  const s = songs[i];
  audio.src = s.file; audio.play();
  $('nowTitle').textContent = s.title; $('nowArtist').textContent = s.artist; $('nowArt').src = s.cover || '';
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: s.title, artist: s.artist, album: s.album || '', artwork: s.cover ? [{ src: s.cover }] : [] });
    navigator.mediaSession.setActionHandler('previoustrack', prev);
    navigator.mediaSession.setActionHandler('nexttrack', next);
  }
  render();
}
function next() {
  if (!songs.length) return;
  if (shuffle && songs.length > 1) { let n; do n = Math.floor(Math.random() * songs.length); while (n === current); play(n); }
  else play((current + 1) % songs.length);
}
function prev() { if (audio.currentTime > 3) audio.currentTime = 0; else play((current - 1 + songs.length) % songs.length); }

$('toggle').onclick = () => { if (current < 0) return play(0); audio.paused ? audio.play() : audio.pause(); };
$('next').onclick = next;
$('prev').onclick = prev;
$('shuffle').onclick = e => { shuffle = !shuffle; e.currentTarget.classList.toggle('on', shuffle); };
$('repeat').onclick = e => { repeat = !repeat; e.currentTarget.classList.toggle('on', repeat); };
$('seek').oninput = e => { if (audio.duration) audio.currentTime = e.target.value / 1000 * audio.duration; };
$('vol').oninput = e => { audio.volume = e.target.value / 100; setRange(e.target, e.target.value); };
setRange($('vol'), 80); setRange($('seek'), 0);

audio.onplay = audio.onpause = syncPaused;
audio.ontimeupdate = () => {
  $('pos').textContent = fmt(audio.currentTime); $('dur').textContent = fmt(audio.duration);
  if (audio.duration) setRange($('seek'), Math.round(audio.currentTime / audio.duration * 1000));
};
audio.onended = () => repeat ? (audio.currentTime = 0, audio.play()) : next();
</script>
</body>
</html>
