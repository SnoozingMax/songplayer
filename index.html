<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wavelength</title>
<style>
  :root { --bg:#fff; --ink:#111; --muted:#6b6b6b; --line:#e8e8e8; --soft:#f5f5f5; --accent:#1f6feb; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.4 -apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif; }
  body { padding-bottom:calc(110px + env(safe-area-inset-bottom)); }
  header { display:flex; align-items:center; gap:12px; padding:16px 20px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:5; }
  header h1 { font-size:18px; font-weight:600; margin:0; }
  header input { flex:1; max-width:480px; padding:9px 13px; border:1px solid var(--line); border-radius:8px; font-size:15px; background:var(--soft); outline:none; }
  header input:focus { border-color:var(--ink); background:#fff; }
  main { max-width:860px; margin:0 auto; padding:16px 12px; }
  .empty { color:var(--muted); text-align:center; padding:80px 20px; }
  .track { display:grid; grid-template-columns:28px 44px 1fr auto; gap:12px; align-items:center; padding:8px 10px; border-radius:8px; cursor:pointer; }
  .track:active, .track:hover, .track.active { background:var(--soft); }
  .track .n { color:var(--muted); font-size:13px; text-align:right; }
  .track img { width:44px; height:44px; border-radius:4px; object-fit:cover; background:var(--soft); }
  .track .t { font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track .a { color:var(--muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track .d { color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; }
  .track.active .t { color:var(--accent); }
  footer { position:fixed; left:0; right:0; bottom:0; background:var(--bg); border-top:1px solid var(--line); padding:10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .now { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:6px; min-height:40px; }
  .now img { width:40px; height:40px; border-radius:4px; background:var(--soft); }
  .now .t { font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .now .a { color:var(--muted); font-size:13px; }
  .bar { display:flex; align-items:center; gap:10px; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .bar input { flex:1; accent-color:var(--ink); }
  .buttons { display:flex; justify-content:center; align-items:center; gap:14px; margin-top:4px; }
  .buttons button { background:none; border:0; width:40px; height:40px; border-radius:50%; display:grid; place-items:center; color:var(--ink); cursor:pointer; }
  .buttons .play { background:var(--ink); color:#fff; width:48px; height:48px; }
  .buttons button.on { color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Wavelength</h1>
  <input id="q" type="search" placeholder="Search" autocomplete="off">
</header>
<main id="list"><div class="empty">Loading…</div></main>
<footer>
  <div class="now"><img id="nowArt" alt=""><div style="min-width:0"><div class="t" id="nowTitle">Nothing playing</div><div class="a" id="nowArtist"></div></div></div>
  <div class="bar"><span id="pos">0:00</span><input id="seek" type="range" min="0" max="1000" value="0"><span id="dur">0:00</span></div>
  <div class="buttons">
    <button id="shuffle" title="Shuffle"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
    <button id="prev" title="Previous"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
    <button id="toggle" class="play" title="Play / Pause">
      <svg id="iconPlay" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg id="iconPause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
    </button>
    <button id="next" title="Next"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
    <button id="repeat" title="Repeat"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></button>
  </div>
</footer>
<audio id="audio" preload="none"></audio>

<script>
const $ = id => document.getElementById(id);
const audio = $('audio');
let songs = [], current = -1, shuffle = false, repeat = false;

function fmt(s) { s = Math.floor(s || 0); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

fetch('songs.json').then(r => r.json()).then(list => { songs = list; render(); })
  .catch(() => { $('list').innerHTML = '<div class="empty">Could not load songs.json</div>'; });

$('q').oninput = render;
function render() {
  const q = $('q').value.trim().toLowerCase();
  const rows = songs.map((s, i) => ({ s, i })).filter(({ s }) => !q || (s.title + ' ' + s.artist + ' ' + (s.album || '')).toLowerCase().includes(q));
  if (!rows.length) { $('list').innerHTML = '<div class="empty">No songs</div>'; return; }
  $('list').innerHTML = rows.map(({ s, i }, n) => `
    <div class="track ${i === current ? 'active' : ''}" data-i="${i}">
      <div class="n">${n + 1}</div>
      <img src="${esc(s.cover || '')}" alt="">
      <div style="min-width:0"><div class="t">${esc(s.title)}</div><div class="a">${esc(s.artist)}${s.album ? ' · ' + esc(s.album) : ''}</div></div>
      <div class="d">${s.duration || ''}</div>
    </div>`).join('');
  $('list').querySelectorAll('.track').forEach(el => el.onclick = () => play(+el.dataset.i));
}

function play(i) {
  if (i < 0 || i >= songs.length) return;
  current = i;
  const s = songs[i];
  audio.src = s.file; audio.play();
  $('nowTitle').textContent = s.title; $('nowArtist').textContent = s.artist; $('nowArt').src = s.cover || '';
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: s.title, artist: s.artist, album: s.album || '', artwork: s.cover ? [{ src: s.cover }] : [] });
    navigator.mediaSession.setActionHandler('previoustrack', prev);
    navigator.mediaSession.setActionHandler('nexttrack', next);
  }
  render();
}
function next() {
  if (!songs.length) return;
  if (shuffle && songs.length > 1) { let n; do n = Math.floor(Math.random() * songs.length); while (n === current); play(n); }
  else play((current + 1) % songs.length);
}
function prev() { if (audio.currentTime > 3) audio.currentTime = 0; else play((current - 1 + songs.length) % songs.length); }

$('toggle').onclick = () => { if (current < 0) return play(0); audio.paused ? audio.play() : audio.pause(); };
$('next').onclick = next;
$('prev').onclick = prev;
$('shuffle').onclick = e => { shuffle = !shuffle; e.currentTarget.classList.toggle('on', shuffle); };
$('repeat').onclick = e => { repeat = !repeat; e.currentTarget.classList.toggle('on', repeat); };
$('seek').oninput = e => { if (audio.duration) audio.currentTime = e.target.value / 1000 * audio.duration; };

audio.onplay = audio.onpause = () => { $('iconPlay').hidden = !audio.paused; $('iconPause').hidden = audio.paused; };
audio.ontimeupdate = () => { $('pos').textContent = fmt(audio.currentTime); $('dur').textContent = fmt(audio.duration); if (audio.duration) $('seek').value = Math.round(audio.currentTime / audio.duration * 1000); };
audio.onended = () => repeat ? (audio.currentTime = 0, audio.play()) : next();
</script>
</body>
</html>
