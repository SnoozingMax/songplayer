<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orbital</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2315140f'/%3E%3Ccircle cx='12' cy='12' r='8.5' fill='none' stroke='%23f4f2ee' stroke-width='1.8'/%3E%3Ccircle cx='12' cy='12' r='5.5' fill='none' stroke='%23f4f2ee' stroke-width='.8' opacity='.5'/%3E%3Ccircle cx='12' cy='12' r='2.2' fill='%23f4f2ee'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f4f2ee; --ink:#15140f; --muted:#6f6c64; --faint:#a9a59c;
    --glass:rgba(255,255,255,.55); --glass-strong:rgba(255,255,255,.72);
    --edge:rgba(255,255,255,.75); --edge-dim:rgba(21,20,15,.07);
    --hover:rgba(255,255,255,.55); --accent:#e4572e; --art-opacity:.55;
    --shadow:0 20px 50px -24px rgba(40,30,20,.35);
    color-scheme:light;
  }
  :root[data-theme="dark"] {
    --bg:#0e0e10; --ink:#f3f1ec; --muted:#a3a09a; --faint:#66635e;
    --glass:rgba(28,28,32,.5); --glass-strong:rgba(28,28,32,.68);
    --edge:rgba(255,255,255,.1); --edge-dim:rgba(255,255,255,.06);
    --hover:rgba(255,255,255,.06); --accent:#ff7a52; --art-opacity:.45;
    --shadow:0 20px 50px -20px rgba(0,0,0,.7);
    color-scheme:dark;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; min-height:100%; }
  body { background:transparent; color:var(--ink); font:15px/1.45 Inter,-apple-system,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; padding-bottom:calc(140px + env(safe-area-inset-bottom)); transition:background .4s, color .4s; }
  button { font:inherit; cursor:pointer; color:inherit; }

  /* ambient background: small blurred cover scaled up (Safari-safe) + gradient glow */
  html { background:var(--bg); }
  .ambient { position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none;
    background:
      radial-gradient(60vmax 60vmax at 8% 0%, var(--g1), transparent 60%),
      radial-gradient(55vmax 55vmax at 100% 40%, var(--g2), transparent 60%),
      radial-gradient(50vmax 50vmax at 40% 110%, var(--g3), transparent 60%),
      var(--bg); transition:background .4s; }
  :root { --g1:rgba(246,199,168,.55); --g2:rgba(201,214,242,.55); --g3:rgba(233,211,239,.55); }
  :root[data-theme="dark"] { --g1:rgba(246,199,168,.08); --g2:rgba(201,214,242,.07); --g3:rgba(233,211,239,.06); }
  .ambient .art { position:absolute; left:50%; top:50%; width:48px; height:48px; margin:-24px 0 0 -24px;
    background-size:cover; background-position:center; filter:blur(4px) saturate(1.6);
    transform:scale(var(--s,40)); opacity:0; transition:opacity 1.2s ease; will-change:opacity; }
  .ambient .art.show { opacity:var(--art-opacity); }

  .wrap { max-width:960px; margin:0 auto; padding:0 20px; }

  header { display:flex; align-items:center; gap:14px; padding:34px 0 18px; animation:rise .6s cubic-bezier(.2,.8,.2,1) both; }
  .logo { width:34px; height:34px; border-radius:10px; display:grid; place-items:center; background:var(--ink); color:var(--bg); }
  .logo svg { animation:spin 6s linear infinite; animation-play-state:paused; }
  body:not(.paused) .logo svg { animation-play-state:running; }
  @keyframes spin { to { transform:rotate(360deg); } }
  header h1 { font-size:22px; font-weight:700; letter-spacing:-.5px; margin:0; }
  header .count { color:var(--muted); font-size:13px; margin-top:3px; }
  header .spacer { flex:1; }

  .glass { background:var(--glass); backdrop-filter:blur(28px) saturate(1.5); -webkit-backdrop-filter:blur(28px) saturate(1.5); border:1px solid var(--edge); box-shadow:var(--shadow), inset 0 1px 0 var(--edge); }

  .iconbtn { width:38px; height:38px; border-radius:12px; display:grid; place-items:center; border:1px solid var(--edge); background:var(--glass); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); color:var(--muted); transition:transform .2s, color .2s; }
  .iconbtn:hover { color:var(--ink); transform:translateY(-1px); }
  .iconbtn:active { transform:scale(.92); }
  .iconbtn .sun { display:none; }
  :root[data-theme="dark"] .iconbtn .moon { display:none; }
  :root[data-theme="dark"] .iconbtn .sun { display:block; }

  .search { position:relative; margin-bottom:22px; animation:rise .6s .06s cubic-bezier(.2,.8,.2,1) both; }
  .search svg { position:absolute; left:16px; top:50%; transform:translateY(-50%); color:var(--faint); pointer-events:none; }
  .search input { width:100%; padding:14px 16px 14px 44px; border-radius:16px; font:inherit; color:var(--ink); outline:none; transition:box-shadow .25s, border-color .25s; }
  .search input::placeholder { color:var(--faint); }
  .search input:focus { border-color:var(--accent); box-shadow:var(--shadow), 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }

  .library { border-radius:24px; padding:10px; animation:rise .7s .12s cubic-bezier(.2,.8,.2,1) both; }
  .empty { color:var(--muted); text-align:center; padding:70px 20px; }
  .group + .group { margin-top:10px; }
  .group h2 { font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:12px 14px 6px; }

  .track { display:grid; grid-template-columns:52px 1fr auto; gap:14px; align-items:center; padding:9px 12px; border-radius:16px; cursor:pointer; position:relative;
           transition:background .2s, transform .25s cubic-bezier(.2,.8,.2,1); animation:rowIn .5s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--i) * 40ms); }
  .track:hover { background:var(--hover); transform:translateX(3px); }
  .track:active { transform:scale(.99); }
  .track.active { background:var(--glass-strong); box-shadow:inset 0 0 0 1px var(--edge), 0 10px 30px -18px var(--accent); }
  .cover { position:relative; width:52px; height:52px; border-radius:12px; overflow:hidden; background:var(--edge-dim); box-shadow:0 6px 16px -8px rgba(0,0,0,.4); transition:transform .3s cubic-bezier(.2,.8,.2,1); }
  .track:hover .cover { transform:scale(1.05); }
  .cover img { width:100%; height:100%; object-fit:cover; display:block; }
  .cover .ov { position:absolute; inset:0; display:grid; place-items:center; background:rgba(0,0,0,.38); color:#fff; opacity:0; transition:opacity .2s; }
  .track:hover .ov, .track.active .ov { opacity:1; }
  .eq { display:flex; align-items:flex-end; gap:2px; height:14px; }
  .eq i { width:3px; background:#fff; border-radius:2px; animation:eq .9s ease-in-out infinite; }
  .eq i:nth-child(2){ animation-delay:.2s } .eq i:nth-child(3){ animation-delay:.4s }
  body.paused .eq i { animation-play-state:paused; }
  @keyframes eq { 0%,100%{height:4px} 50%{height:14px} }
  .track .t { font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:color .2s; }
  .track .a { color:var(--muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track.active .t { color:var(--accent); }
  .track .d { color:var(--faint); font-size:13px; font-variant-numeric:tabular-nums; }

  .credit { text-align:center; color:var(--faint); font-size:12px; margin:22px 0 0; animation:rise .7s .2s cubic-bezier(.2,.8,.2,1) both; }
  /* floating player */
  .player { position:fixed; left:50%; bottom:calc(14px + env(safe-area-inset-bottom)); transform:translate(-50%, 140%); width:min(960px, calc(100% - 24px));
            border-radius:24px; padding:12px 18px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:18px;
            transition:transform .6s cubic-bezier(.2,.9,.2,1); background:var(--glass-strong); z-index:10; }
  .player.up { transform:translate(-50%, 0); }
  .now { display:flex; align-items:center; gap:12px; min-width:0; }
  .now .pic { width:52px; height:52px; border-radius:12px; overflow:hidden; flex:none; background:var(--edge-dim); box-shadow:0 8px 20px -10px rgba(0,0,0,.5); }
  .now .pic img { width:100%; height:100%; object-fit:cover; display:block; animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both; }
  .now .meta { min-width:0; }
  .now .t { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .now .a { color:var(--muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .now .meta > * { animation:fadeUp .45s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes pop { from { transform:scale(.7); opacity:0; } to { transform:scale(1); opacity:1; } }
  @keyframes fadeUp { from { transform:translateY(6px); opacity:0; } to { transform:none; opacity:1; } }

  .ctl { display:flex; flex-direction:column; align-items:center; gap:6px; width:400px; max-width:100%; }
  .btns { display:flex; align-items:center; gap:8px; }
  .btns button { background:none; border:0; width:38px; height:38px; border-radius:50%; display:grid; place-items:center; color:var(--ink); transition:background .2s, transform .15s, color .2s; }
  .btns button:hover { background:var(--hover); }
  .btns button:active { transform:scale(.88); }
  .btns button.on { color:var(--accent); }
  .btns .play { width:46px; height:46px; background:var(--ink); color:var(--bg); box-shadow:0 8px 20px -8px rgba(0,0,0,.45); }
  .btns .play:hover { background:var(--ink); transform:scale(1.06); }
  .btns .play svg { position:absolute; transition:transform .25s cubic-bezier(.2,.9,.3,1.3), opacity .2s; }
  .btns .play { position:relative; }
  .btns .play .ic-pause { transform:scale(.4); opacity:0; }
  .btns .play.playing .ic-play { transform:scale(.4); opacity:0; }
  .btns .play.playing .ic-pause { transform:scale(1); opacity:1; }
  .seek { width:100%; display:flex; align-items:center; gap:10px; font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .seek input { flex:1; }
  .vol { display:flex; justify-content:flex-end; align-items:center; gap:8px; color:var(--muted); }
  .vol input { width:100px; }

  input[type=range] { -webkit-appearance:none; appearance:none; height:5px; border-radius:3px; outline:none; margin:0; cursor:pointer;
    background:linear-gradient(to right, var(--ink) var(--p,0%), var(--edge-dim) var(--p,0%)); transition:height .15s; }
  input[type=range]:hover { height:7px; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:var(--ink); border:3px solid var(--bg); box-shadow:0 2px 6px rgba(0,0,0,.25); transform:scale(0); transition:transform .15s; }
  input[type=range]:hover::-webkit-slider-thumb, input[type=range]:active::-webkit-slider-thumb { transform:scale(1); }
  input[type=range]::-moz-range-thumb { width:12px; height:12px; border-radius:50%; background:var(--ink); border:2px solid var(--bg); }

  @keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
  @keyframes rowIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }

  @media (max-width:720px) {
    header { padding-top:24px; }
    .player { grid-template-columns:1fr; gap:8px; padding:12px 14px; }
    .now { justify-content:flex-start; }
    .ctl { width:100%; }
    .vol { display:none; }
    body { padding-bottom:calc(200px + env(safe-area-inset-bottom)); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
<div class="ambient">
    <div class="art" id="artA"></div><div class="art" id="artB"></div>
</div>

<div class="wrap">
  <header>
    <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10" stroke-width="2"/><circle cx="12" cy="12" r="6.5" stroke-width="1" opacity=".45"/><circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/><path d="M6.2 9.2A6.5 6.5 0 0 1 9.4 6" stroke-width="1.6" stroke-linecap="round"/></svg></div>
    <div><h1>Orbital</h1><div class="count" id="count"></div></div>
    <span class="spacer"></span>
    <button class="iconbtn" id="theme" title="Toggle dark mode">
      <svg class="moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <div class="search">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" class="glass" type="search" placeholder="Search songs, artists, albums" autocomplete="off">
  </div>

  <main id="list" class="library glass"><div class="empty">Loading…</div></main>
  <p class="credit">All songs and artwork belong to their respective artists.</p>
</div>

<div class="player glass" id="player">
  <div class="now">
    <div class="pic" id="nowPic"></div>
    <div class="meta" id="nowMeta"><div class="t">Nothing playing</div><div class="a"></div></div>
  </div>
  <div class="ctl">
    <div class="btns">
      <button id="shuffle" title="Shuffle"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
      <button id="prev" title="Previous"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button id="toggle" class="play" title="Play / Pause">
        <svg class="ic-play" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg class="ic-pause" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
      </button>
      <button id="next" title="Next"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
      <button id="repeat" title="Repeat"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></button>
    </div>
    <div class="seek"><span id="pos">0:00</span><input id="seek" type="range" min="0" max="1000" value="0"><span id="dur">0:00</span></div>
  </div>
  <div class="vol">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7"/></svg>
    <input id="vol" type="range" min="0" max="100" value="80">
  </div>
</div>
<audio id="audio" preload="none"></audio>

<script>
const $ = id => document.getElementById(id);
const audio = $('audio');
let songs = [], current = -1, shuffle = false, repeat = false, artFlip = false;

// theme
(() => { let t = null; try { t = localStorage.getItem('theme'); } catch {}
  document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); })();
$('theme').onclick = () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t; try { localStorage.setItem('theme', t); } catch {}
};

// generated cover for songs without one (or with a broken link)
function placeholder(song) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a8a8e"/><stop offset="1" stop-color="#5c5c60"/></linearGradient></defs>
    <rect width="200" height="200" fill="url(#g)"/>
    <circle cx="100" cy="100" r="62" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="5"/>
    <circle cx="100" cy="100" r="40" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="2"/>
    <circle cx="100" cy="100" r="13" fill="#fff" fill-opacity=".85"/></svg>`;
  return 'data:image/svg+xml,' + encodeURIComponent(svg);
}
const coverOf = song => song.cover || placeholder(song);
const imgTag = (song, extra = '') => `<img src="${esc(coverOf(song))}" alt="" ${extra} onerror="this.onerror=null;this.src=this.dataset.fb" data-fb="${esc(placeholder(song))}">`;

const fmt = s => { s = Math.floor(s || 0); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fitArt = () => document.documentElement.style.setProperty('--s', (Math.max(innerWidth, innerHeight) / 48 * 1.4).toFixed(2));
fitArt(); addEventListener('resize', fitArt);
const setRange = (el, v) => { el.value = v; el.style.setProperty('--p', (v / el.max * 100) + '%'); };

fetch('songs.json', { cache:'no-cache' }).then(r => r.json()).then(list => {
  songs = list;
  $('count').textContent = songs.length + (songs.length === 1 ? ' song' : ' songs');
  render();
}).catch(() => { $('list').innerHTML = '<div class="empty">Could not load songs.json</div>'; });

let lastQ = null;
$('q').oninput = () => render();
function render() {
  const q = $('q').value.trim().toLowerCase();
  const animate = q !== lastQ; lastQ = q;
  const rows = songs.map((s, i) => ({ s, i })).filter(({ s }) => !q || [s.title, s.artist, s.album].join(' ').toLowerCase().includes(q));
  if (!rows.length) { $('list').innerHTML = `<div class="empty">${songs.length ? 'No matches' : 'No songs yet'}</div>`; return; }
  rows.sort((x, y) => (x.s.title || '').localeCompare(y.s.title || '', undefined, { sensitivity:'base', numeric:true }));
  let n = 0;
  $('list').innerHTML = rows.map(({ s, i }) => `
      <div class="track ${i === current ? 'active' : ''}" data-i="${i}" style="--i:${animate ? n++ : 0};${animate ? '' : 'animation:none'}">
        <div class="cover">${imgTag(s, 'loading="lazy"')}<div class="ov">${i === current
          ? '<div class="eq"><i></i><i></i><i></i></div>'
          : '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>'}</div></div>
        <div style="min-width:0"><div class="t">${esc(s.title)}</div><div class="a">${esc(s.artist)}${s.album ? ' · ' + esc(s.album) : ''}</div></div>
        <div class="d">${s.duration || ''}</div>
      </div>`).join('');
  $('list').querySelectorAll('.track').forEach(el => el.onclick = () => play(+el.dataset.i));
  syncPaused();
}
function syncPaused() { document.body.classList.toggle('paused', audio.paused); $('toggle').classList.toggle('playing', !audio.paused); }

function setAmbient(src) {
  const show = artFlip ? $('artA') : $('artB'), hide = artFlip ? $('artB') : $('artA');
  artFlip = !artFlip;
  hide.classList.remove('show');
  if (src) { show.style.backgroundImage = `url("${src}")`; requestAnimationFrame(() => show.classList.add('show')); }
}

function play(i) {
  if (i < 0 || i >= songs.length) return;
  if (i === current) { audio.paused ? audio.play() : audio.pause(); return; }
  current = i;
  const s = songs[i];
  audio.src = s.file; audio.play();
  $('nowPic').innerHTML = imgTag(s);
  $('nowMeta').innerHTML = `<div class="t">${esc(s.title)}</div><div class="a" style="animation-delay:.06s">${esc(s.artist)}</div>`;
  $('player').classList.add('up');
  setAmbient(coverOf(s));
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: s.title, artist: s.artist, album: s.album || '', artwork: s.cover ? [{ src: new URL(s.cover, location.href).href }] : [{ src: placeholder(s) }] });
    navigator.mediaSession.setActionHandler('previoustrack', prev);
    navigator.mediaSession.setActionHandler('nexttrack', next);
  }
  render();
}
const order = () => songs.map((_, i) => i).sort((a, b) => (songs[a].title || '').localeCompare(songs[b].title || '', undefined, { sensitivity:'base', numeric:true }));
function step(d) { const o = order(); const at = o.indexOf(current); play(o[(at + d + o.length) % o.length]); }
function next() {
  if (!songs.length) return;
  if (shuffle && songs.length > 1) { let n; do n = Math.floor(Math.random() * songs.length); while (n === current); play(n); }
  else step(1);
}
function prev() { if (audio.currentTime > 3) audio.currentTime = 0; else step(-1); }

$('toggle').onclick = () => { if (current < 0) return play(order()[0]); audio.paused ? audio.play() : audio.pause(); };
$('next').onclick = next;
$('prev').onclick = prev;
$('shuffle').onclick = e => { shuffle = !shuffle; e.currentTarget.classList.toggle('on', shuffle); };
$('repeat').onclick = e => { repeat = !repeat; e.currentTarget.classList.toggle('on', repeat); };
$('seek').oninput = e => { setRange(e.target, e.target.value); if (audio.duration) audio.currentTime = e.target.value / 1000 * audio.duration; };
$('vol').oninput = e => { audio.volume = e.target.value / 100; setRange(e.target, e.target.value); };
setRange($('vol'), 80); setRange($('seek'), 0);

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type === 'search') return;
  if (e.code === 'Space') { e.preventDefault(); $('toggle').click(); }
  if (e.code === 'ArrowRight' && e.shiftKey) next();
  if (e.code === 'ArrowLeft' && e.shiftKey) prev();
});

audio.onplay = audio.onpause = syncPaused;
audio.ontimeupdate = () => {
  $('pos').textContent = fmt(audio.currentTime); $('dur').textContent = fmt(audio.duration);
  if (audio.duration) setRange($('seek'), Math.round(audio.currentTime / audio.duration * 1000));
};
audio.onended = () => repeat ? (audio.currentTime = 0, audio.play()) : next();
</script>
</body>
</html>
